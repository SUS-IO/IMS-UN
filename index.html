<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d3338" />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <title>IMS — Inventory Management Systems</title>

  <body>
    <div id="root"></div>
    <noscript>IMS needs JavaScript enabled.</noscript>
    <script src="ims-config.js"></script>
    <!-- Maps the library names used in js/ to the bundled copy in vendor/ (no internet CDN, no npm needed) -->
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/vendor.js",
          "react/jsx-runtime": "./vendor/vendor.js",
          "react-dom": "./vendor/vendor.js",
          "react-dom/client": "./vendor/vendor.js",
          "react-router-dom": "./vendor/vendor.js",
          "lucide-react": "./vendor/vendor.js",
          "@supabase/supabase-js": "./vendor/vendor.js",
          "read-excel-file": "./vendor/read-excel-file.js"
        }
      }
    </script>
    <script type="module" src="js/main.js?v=2"></script>
  </body>
</html>
